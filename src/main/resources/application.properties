spring.application.name=dispatch-load-balancer
server.port=${PORT:8080}

# In-memory H2 by default (zero setup). Override with SPRING_DATASOURCE_* env vars for Postgres/MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:dispatchdb;DB_CLOSE_DELAY=-1}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Accept "Orders"/"orders"/"Vehicles" etc. (the assignment PDF samples are inconsistent)
spring.jackson.mapper.accept-case-insensitive-properties=true
